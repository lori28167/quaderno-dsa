name: Installer Windows

# - ogni push su main: controlli + installer scaricabili dagli "Artifacts" della run
# - ogni tag vX.Y.Z: in più crea una Release (bozza) con gli installer allegati
# - pull request: solo controlli e test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # serve per creare la Release quando si pubblica un tag

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.3.4
  NODE_VERSION: 22

jobs:
  checks:
    name: Controlli e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    name: Installer Windows
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Produce l'installer .exe (NSIS) e il pacchetto .msi.
      # Senza tag compila soltanto; con un tag crea anche la Release in bozza.
      - name: Compila e crea gli installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Quaderno DSA ${{ github.ref_name }}
          releaseBody: |
            Installer per Windows:
            - `.exe`: installer consigliato per uso personale
            - `.msi`: pacchetto per l'installazione su più computer (es. laboratori scolastici)
          releaseDraft: true
          prerelease: false

      - name: Carica gli installer tra gli artifact
        uses: actions/upload-artifact@v4
        with:
          name: quaderno-dsa-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
